name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The theme test measures every theme with every look, which takes several minutes by itself.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch the typesetter (refused unless it matches the lock file)
        run: npm run fetch:typst:current
      - run: npm test
      # The second gate: made-up books built through every step, and every line of every page written down.
      - name: Measure the pages
        run: node scripts/page-fingerprint.cjs pages-${{ matrix.os }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-${{ matrix.os }}
          path: pages-${{ matrix.os }}.json
      - name: End-to-end test (real app)
        if: runner.os != 'Linux'
        timeout-minutes: 20
        run: npm run test:e2e
      - name: End-to-end test (real app, virtual display)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: xvfb-run -a npm run test:e2e

  same-pages:
    name: Same pages on Windows, Mac and Linux
    needs: test
    # The pages are compared even when a later test failed, as long as all three were measured.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pages-*
          merge-multiple: true
          path: pages
      - name: Set the three beside each other (fails on any difference, and says what)
        run: |
          test "$(ls pages/*.json | wc -l)" -eq 3 || { echo "Not all three systems were measured."; exit 1; }
          node scripts/compare-pages.cjs pages/pages-ubuntu-latest.json pages/pages-windows-latest.json pages/pages-macos-latest.json
