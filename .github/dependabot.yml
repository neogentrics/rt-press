version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      build-tools:
        patterns: ["electron", "electron-builder", "electron-updater", "esbuild"]
      files-and-storage:
        patterns: ["better-sqlite3-multiple-ciphers", "fflate", "fast-xml-parser"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
